<!-- gestioncar/templates/gestioncar/partials/vehicle_card.html -->
{% load static %}

<div class="card h-100 vehicle-card">
    <span class="badge vehicle-badge bg-light text-dark">
        <img src="{% static 'img/VectorMaxibidderCircle.svg' %}" 
             class="rounded-circle me-1" 
             style="width: 20px; height: 20px; object-fit: contain;">
        #{{ vehicle.stock }}
    </span>

    <div class="image-container" style="height: 220px; overflow: hidden;">
        {% if vehicle.foto_principal %}
        <img src="{{ vehicle.foto_principal.url }}" 
             class="card-img-top h-100 object-fit-cover" 
             alt="{{ vehicle.stock }}">
        {% else %}
        <div class="bg-secondary d-flex align-items-center justify-content-center h-100">
            <i class="bi bi-car-front text-white display-4"></i>
        </div>
        {% endif %}
    </div>

    <div class="card-body">
        <h5 class="card-title fw-bold mb-3">
            {{ vehicle.make.make }} 
            <small class="text-muted d-block">{{ vehicle.car_model.model_make }}</small>
        </h5>
        
        <div class="specs-grid row g-2 mb-3">
            <div class="col-6">
                <div class="bg-light p-2 rounded text-center">
                    <i class="bi bi-speedometer2 text-primary"></i>
                    <small class="d-block">{{ vehicle.mileage|floatformat:0 }} mi</small>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-light p-2 rounded text-center">
                    <i class="bi bi-calendar-event text-primary"></i>
                    <small class="d-block">{{ vehicle.year }}</small>
                </div>
            </div>
        </div>
    </div>
</div>
