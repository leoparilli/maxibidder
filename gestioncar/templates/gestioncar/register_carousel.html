{% extends "gestioncar/template.html" %}
{% load static %}
{% block title %}Add Slide{% endblock %}
{% block content %}
<div class="container py-4">
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <h2 class="text-center mb-4">Add Slide</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description"></textarea>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
        </div>
        <div class="mb-3">
            <label for="link" class="form-label">Link</label>
            <input type="url" class="form-control" id="link" name="link" placeholder="https://example.com">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="show_title" name="show_title" checked>
            <label class="form-check-label" for="show_title">Show Title</label>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="show_description" name="show_description" checked>
            <label class="form-check-label" for="show_description">Show Description</label>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="show_slider" name="show_slider" checked>
            <label class="form-check-label" for="show_slider">Show Slider</label>
        </div>
        <div class="mb-3">
            <label for="order" class="form-label">Order</label>
            <input type="number" class="form-control" id="order" name="order" value="0">
        </div>
        <button type="submit" class="btn btn-success">Save</button>
    </form>
</div>
<script>
    // Esperar 3 segundos y luego ocultar los mensajes
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            alert.classList.remove('show');
            alert.classList.add('fade');
            setTimeout(() => {
                alert.style.display = 'none'; // Oculta el mensaje
            }, 150); // Tiempo para el efecto de desvanecimiento
        });
    }, 3000); // 3000 milisegundos = 3 segundos
</script>
{% endblock %}
