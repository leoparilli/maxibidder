{% extends "gestioncar/template.html" %}
{% load static %}
{% block title %} Admin Make {% endblock%}
{% block content %}
<div class="container py-4">
    <div class="container py-4">
    <div class="row">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 shadow mx-auto  p-2"> <!-- w-50 shadow mx-auto p-2 m-3-->
            <h2 class="text-center mb-2" style="background-color: #4384e6; color: white; padding: 10px;"><i class="bi bi-person-gear me-2"></i>Management Brands </h2>
            <div class="card">
                <div class="card-body"> <!--Agregar-->
                    <form action="{% url  'brandedit' %}" method="post">
                        {% csrf_token %} 
                        <div class="form-group">
                            <label for="brand">Current Brand:</label>
                            <input type="text" id="txtCurrentbrand" name="current_brand" class="form-control bg-secondary text-white" value="{{ brand.make }}" readonly disabled>

                            <label for="brand" class="mt-3">Update Brand:</label>
                            <input type="hidden" name='id' value="{{ brand.id }}" >
                        </div>
                        <div class="form-group">
                            <input type="text" id="txtbrand" name="txtbrand" class="form-control " placeholder="Brand" minlength="3" maxlength="30" required value="{{ brand.make }}">
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-warning w-100 text-white my-2" >Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script>
    // Esperar 3 segundos y luego ocultar los mensajes
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            alert.classList.remove('show');
            alert.classList.add('fade');
            setTimeout(() => {
                alert.style.display = 'none'; // Oculta el mensaje
            }, 150); // Tiempo para el efecto de desvanecimiento
        });
    }, 3000); // 3000 milisegundos = 3 segundos
</script>

{% endblock%}
