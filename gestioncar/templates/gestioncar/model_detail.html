{% extends "gestioncar/template.html" %}
{% load static %}
{% block title %} Admin Model Detail {% endblock %}
{% block content %}
<div class="container py-4">
    <div class="container py-4">
        <div class="row">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 shadow mx-auto p-2">
                <h2 class="text-center mb-2" style="background-color: #4384e6; color: white; padding: 10px;"><i class="bi bi-person-gear me-2"></i>Management Models</h2>
                <div class="card">
                    <div class="card-body">
                        <form action="{% url 'modeledit' %}" method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="make">Current Brand:</label>
                                <input type="text" id="txtCurrentMake" name="current_make" class="form-control bg-secondary text-white" value="{{ model.make.make }}" readonly disabled>

                                <label for="make" class="mt-3">Selected Update Brand:</label>
                                <select name="make" id="txtMake" class="form-control bg-primary text-white">
                                    {% for brand in brands %}
                                        {% if model.make.id == brand.id %}
                                            <option value="{{ brand.id }}" selected>{{ brand.make }}</option>
                                        {% else %}
                                            <option value="{{ brand.id }}">{{ brand.make }}</option>
                                        {% endif %}
                                    {% endfor %}
                                </select>

                                <label for="model">Current Model:</label>
                                <input type="text" id="txtCurrentModel" name="current_model" class="form-control bg-secondary text-white" value="{{ model.model_make }}" readonly disabled>

                                <label for="model" class="mt-3">Update Model:</label>
                                <input type="hidden" name='id' value="{{ model.id }}" >
                                <input type="text" id="txtModel" name="txtmodel" class="form-control" placeholder="Model" minlength="3" maxlength="50" required value="{{ model.model_make }}">
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-warning w-100 text-white my-2">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Esperar 3 segundos y luego ocultar los mensajes
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.classList.remove('show');
                alert.classList.add('fade');
                setTimeout(() => {
                    alert.style.display = 'none'; // Oculta el mensaje
                }, 150); // Tiempo para el efecto de desvanecimiento
            });
        }, 3000); // 3000 milisegundos = 3 segundos
    </script>

{% endblock %}
